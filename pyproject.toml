[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traceserve"
version = "0.1.0"
description = "Observable, KV-aware LLM inference based on nano-vLLM"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "xxhash>=3.4,<4", "tqdm>=4.66,<5"]

[project.optional-dependencies]
gpu = ["torch>=2.4,<2.9", "triton>=3,<3.5", "transformers>=4.51,<5", "safetensors>=0.4,<1", "flash-attn>=2.7,<3"]
http = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.115,<1", "ruff>=0.9,<1"]

[project.scripts]
traceserve = "traceserve.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*", "traceserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU, FlashAttention, and a local Qwen3 checkpoint"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
